name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribí exactamente DEPLOY para confirmar el despliegue a producción'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    env:
      TARGET_REF: ${{ github.ref }}
      CONFIRM: ${{ github.event.inputs.confirm }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
    steps:
      - name: Verificar rama y confirmación
        run: |
          set -euo pipefail
          if [ "$TARGET_REF" != "refs/heads/main" ]; then
            echo "Este workflow solo despliega la rama main."
            exit 1
          fi
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "Confirmación inválida. Escribí exactamente DEPLOY."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Build
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Verificar dist
        id: dist
        run: |
          set -euo pipefail
          command -v sha256sum >/dev/null
          command -v tar >/dev/null
          command -v grep >/dev/null
          test -f dist/index.html
          test -d dist/assets

          mapfile -t ASSETS < <(grep -oE '(src|href)="/assets/[^"]+\.(js|css)"' dist/index.html | grep -oE '/assets/[^"]+\.(js|css)' | sort -u)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No se encontraron referencias locales /assets/*.js o /assets/*.css en dist/index.html."
            exit 1
          fi

          JS_COUNT=0
          MANIFEST="${RUNNER_TEMP}/asset-manifest.tsv"
          : > "$MANIFEST"
          for asset in "${ASSETS[@]}"; do
            rel="${asset#/}"
            if [ ! -f "dist/$rel" ]; then
              echo "El asset referenciado no existe en dist."
              exit 1
            fi
            case "$asset" in
              *.js) JS_COUNT=$((JS_COUNT + 1)) ;;
            esac
            hash="$(sha256sum "dist/$rel" | awk '{print $1}')"
            size="$(wc -c < "dist/$rel" | tr -d ' ')"
            printf '%s\t%s\t%s\n' "$rel" "$hash" "$size" >> "$MANIFEST"
          done

          if [ "$JS_COUNT" -lt 1 ]; then
            echo "dist/index.html no referencia ningún JS local bajo /assets/."
            exit 1
          fi

          ASSET_JS="$(awk -F '\t' '$1 ~ /\.js$/ { print "/" $1; exit }' "$MANIFEST")"
          echo "asset_js=$ASSET_JS" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Publicar
        id: publish
        env:
          ASSET_JS: ${{ steps.dist.outputs.asset_js }}
          ASSET_MANIFEST: ${{ steps.dist.outputs.manifest }}
        run: |
          set -euo pipefail
          KEYFILE=""
          ROLLED_BACK=0
          RESULT="failed"
          cleanup() {
            if [ -n "${KEYFILE:-}" ]; then
              rm -f "$KEYFILE"
            fi
            {
              echo "result=$RESULT"
              echo "rolled_back=$ROLLED_BACK"
            } >> "$GITHUB_OUTPUT"
          }
          trap cleanup EXIT

          require_cmd() {
            if ! command -v "$1" >/dev/null; then
              echo "Falta la herramienta $1 en el runner."
              exit 1
            fi
          }

          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Falta el secret $name."
              exit 1
            fi
          }

          require_cmd ssh
          require_cmd scp
          require_cmd tar
          require_cmd curl
          require_cmd sha256sum
          require_cmd mktemp
          require_cmd node

          require_secret DEPLOY_HOST "$DEPLOY_HOST"
          require_secret DEPLOY_PORT "$DEPLOY_PORT"
          require_secret DEPLOY_USER "$DEPLOY_USER"
          require_secret DEPLOY_SSH_KEY "$DEPLOY_SSH_KEY"
          require_secret DEPLOY_KNOWN_HOSTS "$DEPLOY_KNOWN_HOSTS"
          require_secret DEPLOY_PATH "$DEPLOY_PATH"
          require_secret DEPLOY_URL "$DEPLOY_URL"

          case "$DEPLOY_PATH" in
            ''|'/'|'/var'|'/var/'|'/var/www'|'/var/www/')
              echo "DEPLOY_PATH no es una ruta de publicación válida."
              exit 1
              ;;
          esac
          case "$DEPLOY_PATH" in
            *'$'*|*'{'*|'}'*)
              echo "DEPLOY_PATH contiene un valor sin resolver."
              exit 1
              ;;
          esac
          if [ "${DEPLOY_PATH#/}" = "$DEPLOY_PATH" ]; then
            echo "DEPLOY_PATH debe ser una ruta absoluta."
            exit 1
          fi
          if [ "${DEPLOY_PATH#/var/www/}" = "$DEPLOY_PATH" ]; then
            echo "DEPLOY_PATH está fuera del árbol de publicación esperado."
            exit 1
          fi

          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_PORT no es un puerto válido."
            exit 1
          fi

          if [ ! -f "$ASSET_MANIFEST" ]; then
            echo "No se encontró el manifiesto de assets."
            exit 1
          fi
          if [ -z "${ASSET_JS:-}" ]; then
            echo "No se identificó el asset JS esperado."
            exit 1
          fi

          ORIGIN_HOST="$(node -e 'const u=new URL(process.env.DEPLOY_URL); process.stdout.write(u.hostname)')"
          ORIGIN_PREFIX="$(node -e 'const u=new URL(process.env.DEPLOY_URL); process.stdout.write(u.pathname.replace(/\/$/,""))')"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEYFILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH_OPTS=(
            -i "$KEYFILE"
            -p "$DEPLOY_PORT"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          SCP_OPTS=(
            -i "$KEYFILE"
            -P "$DEPLOY_PORT"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh "${SSH_OPTS[@]}" "$REMOTE" 'printf ok'

          BUNDLE="$(mktemp --suffix=.tar.gz)"
          tar -C dist -czf "$BUNDLE" .
          STAGE_ID="${GITHUB_SHA}"
          BACKUP_NAME="frontend-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}.tar.gz"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "STAGE_ID=$(printf '%q' "$STAGE_ID") BACKUP_NAME=$(printf '%q' "$BACKUP_NAME") DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'REMOTE'
          set -euo pipefail
          case "$DEPLOY_PATH" in
            ''|'/'|'/var'|'/var/'|'/var/www'|'/var/www/') echo "Ruta de publicación inválida."; exit 1 ;;
          esac
          if [ "${DEPLOY_PATH#/var/www/}" = "$DEPLOY_PATH" ]; then
            echo "Ruta de publicación fuera del árbol esperado."
            exit 1
          fi
          if [ ! -d "$DEPLOY_PATH" ] || [ ! -w "$DEPLOY_PATH" ]; then
            echo "No hay permiso de escritura en la ruta de publicación."
            exit 1
          fi
          for tool in tar mkdir cp rm find ls bash; do
            if ! command -v "$tool" >/dev/null; then
              echo "Falta $tool en el servidor."
              exit 1
            fi
          done
          if ! command -v sha256sum >/dev/null && ! command -v openssl >/dev/null; then
            echo "Falta sha256sum u openssl en el servidor."
            exit 1
          fi
          if ! command -v curl >/dev/null; then
            echo "Falta curl en el servidor."
            exit 1
          fi
          WORK="$HOME/.control-accesos-deploy"
          BACKUP_DIR="$WORK/backups"
          STAGE_ROOT="$WORK/staging"
          STAGE="$STAGE_ROOT/$STAGE_ID"
          mkdir -p "$BACKUP_DIR" "$STAGE"
          touch "$DEPLOY_PATH/.deploy-write-test"
          rm -f "$DEPLOY_PATH/.deploy-write-test"
          tar -C "$DEPLOY_PATH" -czf "$BACKUP_DIR/$BACKUP_NAME" .
          mapfile -t OLD_BACKUPS < <(ls -1t "$BACKUP_DIR"/frontend-*.tar.gz 2>/dev/null || true)
          if [ "${#OLD_BACKUPS[@]}" -gt 3 ]; then
            printf '%s\n' "${OLD_BACKUPS[@]:3}" | xargs -r rm -f
          fi
          REMOTE

          scp "${SCP_OPTS[@]}" "$BUNDLE" "$REMOTE:.control-accesos-deploy/staging/${STAGE_ID}/bundle.tar.gz"
          scp "${SCP_OPTS[@]}" "$ASSET_MANIFEST" "$REMOTE:.control-accesos-deploy/staging/${STAGE_ID}/asset-manifest.tsv"
          rm -f "$BUNDLE"

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "STAGE_ID=$(printf '%q' "$STAGE_ID") bash -s" <<'REMOTE'
          set -euo pipefail
          STAGE="$HOME/.control-accesos-deploy/staging/$STAGE_ID"
          EXTRACT="$STAGE/tree"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          ARCHIVE_LIST="$STAGE/archive-list.txt"
          tar -tzf "$STAGE/bundle.tar.gz" > "$ARCHIVE_LIST"
          NORMALIZED="$STAGE/archive-list.normalized.txt"
          sed 's#^\./##' "$ARCHIVE_LIST" > "$NORMALIZED"
          if ! grep -qx 'index.html' "$NORMALIZED"; then
            echo "El bundle no incluye index.html en la raíz."
            exit 1
          fi
          if ! grep -qE '^assets/' "$NORMALIZED"; then
            echo "El bundle no incluye archivos bajo assets/."
            exit 1
          fi
          tar -C "$EXTRACT" -xzf "$STAGE/bundle.tar.gz"
          test -f "$EXTRACT/index.html"
          test -d "$EXTRACT/assets"
          test -n "$(ls -A "$EXTRACT/assets")"
          file_sha() {
            if command -v sha256sum >/dev/null; then
              sha256sum "$1" | awk '{print $1}'
            else
              openssl dgst -sha256 "$1" | awk '{print $NF}'
            fi
          }
          while IFS=$'\t' read -r rel hash size; do
            [ -n "$rel" ] || continue
            test -f "$EXTRACT/$rel"
            actual="$(file_sha "$EXTRACT/$rel")"
            bytes="$(wc -c < "$EXTRACT/$rel" | tr -d ' ')"
            if [ "$actual" != "$hash" ] || [ "$bytes" != "$size" ]; then
              echo "El asset extraído no coincide con el manifiesto local."
              exit 1
            fi
          done < "$STAGE/asset-manifest.tsv"
          REMOTE

          copy_without_index() {
            ssh "${SSH_OPTS[@]}" "$REMOTE" \
              "TREE_REL=$(printf '%q' "$1") DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'REMOTE'
            set -euo pipefail
            case "$DEPLOY_PATH" in
              ''|'/'|'/var'|'/var/'|'/var/www'|'/var/www/') echo "Ruta de publicación inválida."; exit 1 ;;
            esac
            if [ "${DEPLOY_PATH#/var/www/}" = "$DEPLOY_PATH" ]; then
              echo "Ruta de publicación fuera del árbol esperado."
              exit 1
            fi
            SOURCE="$HOME/$TREE_REL"
            test -f "$SOURCE/index.html"
            test -d "$SOURCE/assets"
            mkdir -p "$DEPLOY_PATH/assets"
            cp -a "$SOURCE/assets/." "$DEPLOY_PATH/assets/"
            shopt -s dotglob nullglob
            for item in "$SOURCE"/*; do
              base="$(basename "$item")"
              if [ "$base" = "index.html" ] || [ "$base" = "assets" ]; then
                continue
              fi
              cp -a "$item" "$DEPLOY_PATH/"
            done
            REMOTE
          }

          publish_index() {
            ssh "${SSH_OPTS[@]}" "$REMOTE" \
              "TREE_REL=$(printf '%q' "$1") DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'REMOTE'
            set -euo pipefail
            case "$DEPLOY_PATH" in
              ''|'/'|'/var'|'/var/'|'/var/www'|'/var/www/') echo "Ruta de publicación inválida."; exit 1 ;;
            esac
            SOURCE="$HOME/$TREE_REL"
            test -f "$SOURCE/index.html"
            cp -a "$SOURCE/index.html" "$DEPLOY_PATH/index.html"
            REMOTE
          }

          prune_stale() {
            ssh "${SSH_OPTS[@]}" "$REMOTE" \
              "TREE_REL=$(printf '%q' "$1") DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'REMOTE'
            set -euo pipefail
            case "$DEPLOY_PATH" in
              ''|'/'|'/var'|'/var/'|'/var/www'|'/var/www/') echo "Ruta de publicación inválida."; exit 1 ;;
            esac
            if [ "${DEPLOY_PATH#/var/www/}" = "$DEPLOY_PATH" ]; then
              echo "Ruta de publicación fuera del árbol esperado."
              exit 1
            fi
            SOURCE="$HOME/$TREE_REL"
            while IFS= read -r -d '' file; do
              rel="${file#./}"
              if [ ! -e "$SOURCE/$rel" ]; then
                rm -f "$DEPLOY_PATH/$rel"
              fi
            done < <(cd "$DEPLOY_PATH" && find . -type f -print0)
            find "$DEPLOY_PATH" -mindepth 1 -type d -empty -delete
            REMOTE
          }

          restore_backup() {
            ssh "${SSH_OPTS[@]}" "$REMOTE" \
              "BACKUP_NAME=$(printf '%q' "$BACKUP_NAME") DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'REMOTE'
            set -euo pipefail
            case "$DEPLOY_PATH" in
              ''|'/'|'/var'|'/var/'|'/var/www'|'/var/www/') echo "Ruta de publicación inválida."; exit 1 ;;
            esac
            BACKUP="$HOME/.control-accesos-deploy/backups/$BACKUP_NAME"
            RESTORE="$HOME/.control-accesos-deploy/restore-$$"
            rm -rf "$RESTORE"
            mkdir -p "$RESTORE"
            tar -C "$RESTORE" -xzf "$BACKUP"
            if [ -d "$RESTORE/assets" ]; then
              mkdir -p "$DEPLOY_PATH/assets"
              cp -a "$RESTORE/assets/." "$DEPLOY_PATH/assets/"
            fi
            shopt -s dotglob nullglob
            for item in "$RESTORE"/*; do
              base="$(basename "$item")"
              if [ "$base" = "index.html" ] || [ "$base" = "assets" ]; then
                continue
              fi
              cp -a "$item" "$DEPLOY_PATH/"
            done
            if [ -f "$RESTORE/index.html" ]; then
              cp -a "$RESTORE/index.html" "$DEPLOY_PATH/index.html"
            fi
            while IFS= read -r -d '' file; do
              rel="${file#./}"
              if [ ! -e "$RESTORE/$rel" ]; then
                rm -f "$DEPLOY_PATH/$rel"
              fi
            done < <(cd "$DEPLOY_PATH" && find . -type f -print0)
            find "$DEPLOY_PATH" -mindepth 1 -type d -empty -delete
            rm -rf "$RESTORE"
            REMOTE
          }

          fail_and_rollback() {
            local message="$1"
            ROLLED_BACK=1
            restore_backup
            echo "$message"
            exit 1
          }

          origin_check() {
            local path="$1"
            local expected_hash="$2"
            local expected_size="$3"
            local expect_html="$4"
            ssh "${SSH_OPTS[@]}" "$REMOTE" \
              "ORIGIN_HOST=$(printf '%q' "$ORIGIN_HOST") ORIGIN_PREFIX=$(printf '%q' "$ORIGIN_PREFIX") REQ_PATH=$(printf '%q' "$path") EXPECTED_HASH=$(printf '%q' "$expected_hash") EXPECTED_SIZE=$(printf '%q' "$expected_size") EXPECT_HTML=$(printf '%q' "$expect_html") bash -s" <<'REMOTE'
            set -euo pipefail
            BODY="$(mktemp)"
            HDR="$(mktemp)"
            cleanup_tmp() { rm -f "$BODY" "$HDR"; }
            trap cleanup_tmp EXIT

            fetch() {
              local extra=()
              if [ "$1" = "tls" ]; then
                extra=(-k)
                shift
              fi
              local url="$1"
              : > "$BODY"
              : > "$HDR"
              curl -sS --max-time 20 --max-redirs 0 "${extra[@]}" \
                -H "Host: $ORIGIN_HOST" \
                -H 'Accept-Encoding: identity' \
                -D "$HDR" -o "$BODY" \
                -w '%{http_code}' \
                "$url"
            }

            CODE=""
            if CODE="$(fetch "http://127.0.0.1${ORIGIN_PREFIX}${REQ_PATH}")" && [ "$CODE" = "200" ]; then
              :
            elif CODE="$(fetch tls "https://127.0.0.1${ORIGIN_PREFIX}${REQ_PATH}")" && [ "$CODE" = "200" ]; then
              :
            else
              echo "El origen no respondió HTTP 200 para el recurso solicitado."
              exit 1
            fi

            if grep -qiE '^content-type:[[:space:]]*text/html' "$HDR"; then
              IS_HTML=1
            elif head -c 256 "$BODY" | grep -qiE '^[[:space:]]*<(!doctype[[:space:]]+html|html)'; then
              IS_HTML=1
            else
              IS_HTML=0
            fi

            BYTES="$(wc -c < "$BODY" | tr -d ' ')"
            if [ "$EXPECT_HTML" = "1" ]; then
              if [ "$IS_HTML" != "1" ]; then
                echo "El origen no devolvió HTML para index.html."
                exit 1
              fi
            else
              if [ "$IS_HTML" = "1" ]; then
                echo "El origen devolvió HTML en lugar del asset. No se interpreta 200 como éxito."
                exit 1
              fi
              if [ "$BYTES" != "$EXPECTED_SIZE" ]; then
                echo "El tamaño del asset en el origen no es coherente."
                exit 1
              fi
              ACTUAL=""
              if command -v sha256sum >/dev/null; then
                ACTUAL="$(sha256sum "$BODY" | awk '{print $1}')"
              else
                ACTUAL="$(openssl dgst -sha256 "$BODY" | awk '{print $NF}')"
              fi
              if [ "$ACTUAL" != "$EXPECTED_HASH" ]; then
                echo "El SHA-256 del asset en el origen no coincide."
                exit 1
              fi
            fi
            REMOTE
          }

          if ! copy_without_index ".control-accesos-deploy/staging/${STAGE_ID}/tree"; then
            fail_and_rollback "La copia de assets falló y se restauró el respaldo."
          fi

          while IFS=$'\t' read -r rel hash size; do
            [ -n "$rel" ] || continue
            if ! origin_check "/$rel" "$hash" "$size" "0"; then
              fail_and_rollback "La validación de origen de un asset falló y se restauró el respaldo."
            fi
          done < "$ASSET_MANIFEST"

          if ! publish_index ".control-accesos-deploy/staging/${STAGE_ID}/tree"; then
            fail_and_rollback "La publicación de index.html falló y se restauró el respaldo."
          fi

          if ! origin_check "/" "" "" "1"; then
            fail_and_rollback "La validación de origen de index.html falló y se restauró el respaldo."
          fi

          if ! ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "ASSET_JS=$(printf '%q' "$ASSET_JS") ORIGIN_HOST=$(printf '%q' "$ORIGIN_HOST") ORIGIN_PREFIX=$(printf '%q' "$ORIGIN_PREFIX") bash -s" <<'REMOTE'
          set -euo pipefail
          BODY="$(mktemp)"
          HDR="$(mktemp)"
          cleanup_tmp() { rm -f "$BODY" "$HDR"; }
          trap cleanup_tmp EXIT
          CODE="$(curl -sS --max-time 20 --max-redirs 0 \
            -H "Host: $ORIGIN_HOST" \
            -H 'Accept-Encoding: identity' \
            -D "$HDR" -o "$BODY" \
            -w '%{http_code}' \
            "http://127.0.0.1${ORIGIN_PREFIX}/" || true)"
          if [ "$CODE" != "200" ]; then
            CODE="$(curl -sS --max-time 20 --max-redirs 0 -k \
              -H "Host: $ORIGIN_HOST" \
              -H 'Accept-Encoding: identity' \
              -D "$HDR" -o "$BODY" \
              -w '%{http_code}' \
              "https://127.0.0.1${ORIGIN_PREFIX}/" || true)"
          fi
          if [ "$CODE" != "200" ] || ! grep -qiE '<(!doctype )?html' "$BODY" || ! grep -F "$ASSET_JS" "$BODY" >/dev/null; then
            echo "El HTML de origen no referencia el asset JS esperado."
            exit 1
          fi
          REMOTE
          then
            fail_and_rollback "La comprobación de origen posterior a la publicación falló y se restauró el respaldo."
          fi

          SMOKE_URL="${DEPLOY_URL}/?v=${GITHUB_SHA}"
          BODY="$(mktemp)"
          if ! curl -sS -L --fail --retry 8 --retry-all-errors --retry-delay 2 \
            -A "control-accesos-frontend-deploy" \
            -o "$BODY" \
            "$SMOKE_URL"; then
            rm -f "$BODY"
            fail_and_rollback "El smoke test público falló y se restauró el respaldo."
          fi

          if ! grep -qiE '<(!doctype )?html' "$BODY"; then
            rm -f "$BODY"
            fail_and_rollback "El smoke test público no devolvió HTML y se restauró el respaldo."
          fi
          if ! grep -F "$ASSET_JS" "$BODY" >/dev/null; then
            rm -f "$BODY"
            fail_and_rollback "El HTML público no coincide con el asset del build. Se restauró el respaldo."
          fi
          rm -f "$BODY"

          if ! prune_stale ".control-accesos-deploy/staging/${STAGE_ID}/tree"; then
            fail_and_rollback "La limpieza de archivos obsoletos falló y se restauró el respaldo."
          fi

          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "STAGE_ID=$(printf '%q' "$STAGE_ID") bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf "$HOME/.control-accesos-deploy/staging/$STAGE_ID"
          REMOTE

          RESULT="success"

      - name: Resumen
        if: always() && steps.publish.outcome != 'skipped'
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          ROLLED_BACK: ${{ steps.publish.outputs.rolled_back }}
        run: |
          set -euo pipefail
          echo "Commit: ${GITHUB_SHA}"
          echo "Fecha UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Resultado: ${PUBLISH_RESULT:-unknown}"
          if [ "${ROLLED_BACK:-0}" = "1" ]; then
            echo "Rollback: sí"
          else
            echo "Rollback: no"
          fi
